# PX4-Autopilot/src/modules/swivel_robot_controller/module.yaml

module_name: swivel_robot_controller

description: "Swivel Robot Controller module for four-wheel swivel robots. Handles RC input to generate high-level swivel robot commands."

defines:
  - MODULE_NAME="swivel_robot_controller"

components:
  - name: SwivelRobotController
    libraries:
      - uORB
      - px4_platform_common

# PX4 Shell 中可以使用的命令
commands:
  - swivel_robot_controller:
      description: "Swivel Robot Controller module"
      #main: swivelDrive_main # <--- 添加或修改这一行
      usage:
        - start: "Start the module"
        - stop: "Stop the module"
        - status: "Print module status"

# 模块发布和订阅的 uORB 主题 (可选，但推荐用于文档和工具链分析)
publications:
  - swivel_robot_command

subscriptions:
  - manual_control_setpoint
  - vehicle_control_mode
  - vehicle_status
  - parameter_update