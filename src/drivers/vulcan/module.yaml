module_name: VULCAN
actuator_output:
  show_subgroups_if: 'VULCAN_ENABLE>=3'
  config_parameters:
    - param: 'VULCAN_ENABLE'
      label: 'Configure'
      function: 'enable'
    - param: 'VULCAN_BITRATE'
      label: 'Bitrate'
  output_groups:
    - param_prefix: CAN_Test
      group_label: 'Tests'
      channel_label: 'Channel'
      standard_params:
        disarmed: { min: 800, max: 2200, default: 1000 }
        min: { min: 0, max: 8191, default: 1 }
        max: { min: 0, max: 8191, default: 8191 }
        failsafe: { min: 0, max: 8191 }
      num_channels: 8
    - param_prefix: VULCAN_SV
      group_label: 'Servos'
      channel_label: 'Servo'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 500 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      num_channels: 8
